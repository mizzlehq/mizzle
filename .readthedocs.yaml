# Read the Docs: https://docs.readthedocs.com/platform/stable/config-file/v2.html
# Built with Zensical (it reads mkdocs.yml).
version: 2
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  commands:
    - asdf plugin add uv
    - asdf install uv latest
    - asdf global uv latest
    - uv sync --frozen --only-group docs
    - uv run --frozen --only-group docs zensical build --strict --clean
    - mkdir -p $READTHEDOCS_OUTPUT && mv site $READTHEDOCS_OUTPUT/html
