[project]
name = "mizzle"
version = "0.2.2"
description = "Fully typed async ORM for PostgreSQL: SQL-like queries, schema-driven migrations and a data studio"
keywords = ["orm", "postgresql", "asyncpg", "async", "sql", "query-builder", "migrations", "typed"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Database",
    "Topic :: Database :: Front-Ends",
    "Typing :: Typed",
]
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = ["asyncpg>=0.30"]

[project.urls]
Homepage = "https://github.com/mizzlehq/mizzle"
Repository = "https://github.com/mizzlehq/mizzle"
Issues = "https://github.com/mizzlehq/mizzle/issues"

[project.optional-dependencies]
studio = [
    "starlette>=0.40",
    "uvicorn>=0.30",
]
pydantic = [
    "pydantic>=2.7",
]

[project.scripts]
mizzle = "mizzle.kit.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
# The Studio UI is NOT shipped: `mizzle studio` downloads it on first run from the GitHub
# Release, verified by the SHA-256 in ui.json. ui.json is written by the release workflow
# (gitignored), so it is listed here to be included in the wheel.
artifacts = ["src/mizzle/studio/ui.json"]

[tool.hatch.build.targets.sdist]
exclude = ["studio-ui", ".github", "docs", "benchmarks", "examples", "docker-compose.yml"]

[dependency-groups]
dev = [
    "mizzle[studio,pydantic]",  # dev and CI always have the optional extras
    "fastapi>=0.115",  # lets editors and CI type-check examples/social from the repo root
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "pytest-cov>=6.0",
    "mypy>=1.15",
    "ruff>=0.11",
    "asyncpg-stubs>=0.30",
    "httpx>=0.28.1",
    "pydantic>=2.7",
    "basedpyright>=1.40.2",
    "hypothesis>=6.170.14",
]
docs = [
    "zensical>=0.0.74",  # reads mkdocs.yml
    "mkdocstrings[python]>=0.29",
    "ruff>=0.11",  # mkdocstrings formats signatures with it
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
per-file-target-version = { "tests/**/*_py314.py" = "py314" }
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.basedpyright]
# basedpyright (a stricter pyright) is the project's type checker; editors use it too.
include = ["src", "tests"]
ignore = ["tests/**/*_py314.py"]
pythonVersion = "3.12"
typeCheckingMode = "all"
failOnWarnings = true
enableTypeIgnoreComments = false  # "# type: ignore" is for mypy; use "# pyright: ignore"
# Off on purpose:
reportImportCycles = false  # only `if TYPE_CHECKING:` imports form cycles; none run
reportImplicitStringConcatenation = false  # style; long messages are split across lines
reportUnusedCallResult = false  # e.g. rowcounts from execute() are often not needed
reportUnreachable = false  # sys.version_info branches (t-strings on 3.14) look unreachable
reportExplicitAny = false  # writing `Any` is allowed; reportAny still flags Any values in use

[[tool.basedpyright.executionEnvironments]]
# Tests poke at internals and build throwaway classes; keep them type-checked, not linted.
root = "tests"
extraPaths = ["."]
reportAny = false
reportExplicitAny = false
reportUnannotatedClassAttribute = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportUnusedParameter = false
reportUnusedClass = false
reportImplicitOverride = false
reportPrivateUsage = false
reportMissingTypeArgument = false
reportUnknownParameterType = false
reportMissingParameterType = false
reportUnknownLambdaType = false

[[tool.basedpyright.executionEnvironments]]
root = "src"

[[tool.basedpyright.executionEnvironments]]
# The example's tests read untyped JSON responses, like the repo's own tests.
root = "examples/social/tests"
extraPaths = ["examples/social"]
reportAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
# The example is its own project: `social` is imported from its folder, not the repo root.
root = "examples/social"

[tool.mypy]
strict = true
python_version = "3.12"
files = ["src", "tests/typing"]

[tool.coverage.run]
source = ["mizzle"]

[tool.coverage.report]
fail_under = 90
show_missing = true
