[project]
name = "mizzle-example-shop"
version = "0.1.0"
description = "A multi-tenant marketplace API built with mizzle and FastAPI: every 0.2 feature in one app"
requires-python = ">=3.12"
dependencies = [
    "mizzle[pydantic,studio]",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.uv.sources]
mizzle = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
    "basedpyright>=1.40",
    "asyncpg>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = ["soak: long mixed-load run (set SHOP_SOAK_SECONDS)"]

[tool.basedpyright]
include = ["shop", "tests"]
exclude = ["**/pulled_*.py"]
pythonVersion = "3.12"
typeCheckingMode = "all"
failOnWarnings = true
reportImplicitStringConcatenation = false
reportUnusedCallResult = false
reportExplicitAny = false
reportImportCycles = false

[[tool.basedpyright.executionEnvironments]]
# Tests read untyped JSON responses.
root = "tests"
extraPaths = ["."]
reportAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false
reportPrivateUsage = false

[tool.ruff]
extend = "../../pyproject.toml"
src = ["../../src"]  # like the root config: mizzle is first-party
extend-exclude = ["shop/schema_types.py"]  # written by `mizzle typegen`
