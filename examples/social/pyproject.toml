[project]
name = "mizzle-example-social"
version = "0.1.0"
description = "A small social network API built with mizzle and FastAPI"
requires-python = ">=3.12"
dependencies = [
    "mizzle[pydantic]",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[tool.uv]
package = false

[tool.uv.sources]
mizzle = { path = "../..", editable = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.25",
    "httpx>=0.27",
    "basedpyright>=1.40",
    "asyncpg>=0.30",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.basedpyright]
include = ["social", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "all"
failOnWarnings = true
reportImplicitStringConcatenation = false
reportUnusedCallResult = false
reportExplicitAny = false
reportImportCycles = false

[[tool.basedpyright.executionEnvironments]]
# Tests read untyped JSON responses.
root = "tests"
extraPaths = ["."]
reportAny = false
reportUnknownMemberType = false
reportUnknownVariableType = false
reportUnknownArgumentType = false
reportMissingTypeStubs = false

[[tool.basedpyright.executionEnvironments]]
root = "."
