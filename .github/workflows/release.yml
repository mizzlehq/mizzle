name: Release

# Push a tag like v0.2.0: builds the Studio UI as a GitHub Release asset (downloaded by
# `mizzle studio` on first run, verified by SHA-256), then publishes the wheel to PyPI.
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md (stop if this version has none)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release
          awk -v v="$VERSION" '$0 == "## " v {f=1; next} /^## /{f=0} f' CHANGELOG.md > release/notes.md
          if ! grep -q '[^[:space:]]' release/notes.md; then
            echo "CHANGELOG.md has no '## $VERSION' section; add release notes first."; exit 1
          fi
          cat release/notes.md
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: studio-ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: studio-ui/pnpm-lock.yaml
      - name: Build Studio UI
        working-directory: studio-ui
        run: pnpm install --frozen-lockfile && pnpm build
      - uses: astral-sh/setup-uv@v6
      - name: Package the UI as a release asset and write ui.json (URL + SHA-256)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(uv run python -c 'import mizzle; print(mizzle.__version__)')"
          test "$VERSION" = "$PACKAGE_VERSION" || { echo "tag $GITHUB_REF_NAME != mizzle $PACKAGE_VERSION"; exit 1; }
          ZIP="mizzle-studio-$VERSION.zip"
          URL="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$ZIP"
          uv run python -m mizzle.studio.assets src/mizzle/studio/static "$ZIP" --version "$VERSION" --url "$URL"
          mv "$ZIP" release/
          rm -rf src/mizzle/studio/static  # the UI is downloaded, never shipped in the wheel
      - run: uv build
      - name: Check the wheel has ui.json and no UI files
        run: |
          unzip -l dist/*.whl | grep -q "mizzle/studio/ui.json"
          ! unzip -l dist/*.whl | grep -q "mizzle/studio/static/"
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@v4
        with:
          name: studio-ui
          path: release/

  github-release:
    # The UI archive must be downloadable before the wheel that points to it is published.
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: studio-ui
          path: release/
      - uses: softprops/action-gh-release@v2
        with:
          body_path: release/notes.md
          files: release/*.zip

  publish:
    needs: [build, github-release]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # PyPI trusted publishing; no API token stored in GitHub
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
