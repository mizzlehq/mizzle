name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python 3.12
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run pyright
      - run: uv run mypy
      - run: uv run pyright --pythonversion 3.14
      - run: uv run mypy --python-version 3.14

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
        postgres: ["14", "15", "16", "17", "18"]
        include:
          - python: "3.12"
            postgres: "18"
          - python: "3.13"
            postgres: "18"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: mizzle
          POSTGRES_PASSWORD: mizzle
          POSTGRES_DB: mizzle
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIZZLE_TEST_URL: postgresql://mizzle:mizzle@localhost:5432/mizzle
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest --cov --cov-report=term-missing
