name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch makes the running one pointless; stop it.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.12
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run basedpyright
      - run: uv run mypy
      - run: uv run basedpyright --pythonversion 3.14
      - run: uv run mypy --python-version 3.14
      - run: uv run --group docs zensical build --strict --clean && uv run python scripts/llms_full.py  # Read the Docs

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio-ui
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: studio-ui/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: studio-ui/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run ci  # Biome; bare `pnpm ci` is pnpm's own clean-install command
      - run: pnpm build

  studio-assets:
    # The Studio UI zip is unpacked by mizzle on every OS: prove it on each one.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.12
      - run: uv run pytest tests/unit/test_studio_assets.py -v

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.14"]
        postgres: ["14", "15", "16", "17", "18"]
        include:
          - python: "3.12"
            postgres: "18"
          - python: "3.13"
            postgres: "18"
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: mizzle
          POSTGRES_PASSWORD: mizzle
          POSTGRES_DB: mizzle
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      MIZZLE_TEST_URL: postgresql://mizzle:mizzle@localhost:5432/mizzle
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python ${{ matrix.python }}
      - run: uv run pytest --cov --cov-report=term-missing --cov-report=xml
      - name: Upload coverage (one matrix cell)
        if: matrix.python == '3.14' && matrix.postgres == '18'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Example app (examples/social) against Postgres
        working-directory: examples/social
        run: uv sync && uv run basedpyright && uv run pytest

  infra:
    # A real streaming read replica and PgBouncer in transaction mode (tests/infra).
    runs-on: ubuntu-latest
    env:
      MIZZLE_TEST_URL: postgresql://mizzle:mizzle@localhost:54331/mizzle
      MIZZLE_PRIMARY_URL: postgresql://mizzle:mizzle@localhost:54331/mizzle
      MIZZLE_REPLICA_URL: postgresql://mizzle:mizzle@localhost:54332/mizzle
      MIZZLE_PGBOUNCER_URL: postgresql://mizzle:mizzle@localhost:54333/mizzle
      MIZZLE_PGBOUNCER_SESSION_URL: postgresql://mizzle:mizzle@localhost:54337/mizzle
      # TLS-only server with unusual settings, and real restarts (test_production_env.py)
      MIZZLE_ODD_URL: postgresql://mizzle:mizzle@localhost:54334/mizzle?sslmode=require
      MIZZLE_RESTART_CMD: docker compose -f tests/infra/compose.yml restart odd
      MIZZLE_PRIMARY_RESTART_CMD: docker compose -f tests/infra/compose.yml restart primary
      # pgvector (test_vector.py)
      MIZZLE_VECTOR_URL: postgresql://mizzle:mizzle@localhost:54335/mizzle
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv sync --python 3.14
      - run: docker compose -f tests/infra/compose.yml up -d --wait
      - run: uv run pytest tests/integration/test_infra.py tests/integration/test_infra_io.py tests/integration/test_production_env.py tests/integration/test_vector.py -v
      - name: examples/shop on the infra (replica, PgBouncer, pgvector, primary restart)
        working-directory: examples/shop
        env:
          P: postgresql://mizzle:mizzle@localhost
          SHOP_RESTART_CMD: docker compose -f ../../tests/infra/compose.yml restart primary
        run: |
          uv sync
          uv run basedpyright
          SHOP_URL=$P:54331/mizzle SHOP_REPLICA_URL=$P:54332/mizzle uv run pytest -v -k "not restart"
          SHOP_URL=$P:54331/mizzle SHOP_BOUNCER_URL=$P:54333/mizzle uv run pytest -v -k "not restart"
          SHOP_URL=$P:54335/mizzle uv run pytest -v -k "not restart"
          SHOP_URL=$P:54331/mizzle SHOP_REPLICA_URL=$P:54332/mizzle uv run pytest -v tests/test_load.py -k restart
      - if: failure()
        run: docker compose -f tests/infra/compose.yml logs

  package:
    # The release workflow only builds at tag time. Build and install the wheel here so a
    # broken build system, a missing file or a bad entry point fails on the PR, not on tag.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uv build --out-dir dist
      - name: Install the wheel into a clean environment and import it
        run: |
          uv venv ./smoke --python 3.12
          uv pip install --python ./smoke/bin/python dist/*.whl
          ./smoke/bin/python -c "import mizzle; print('mizzle', mizzle.__version__)"
          ./smoke/bin/mizzle --help >/dev/null
      - name: Attach the built distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
