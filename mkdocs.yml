site_name: mizzle
site_description: Fully typed async ORM for Python and PostgreSQL
site_url: https://mizzle.readthedocs.io/
repo_url: https://github.com/mizzlehq/mizzle
repo_name: mizzlehq/mizzle
edit_uri: edit/main/docs/
strict: true
exclude_docs: |
  superpowers/

theme:
  name: material
  logo: assets/mark.svg
  favicon: assets/mark.svg
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.tabs
    - navigation.sections
    - navigation.instant
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle: { icon: material/weather-sunny, name: Light mode }

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.snippets:
      check_paths: true
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            heading_level: 2
            members_order: source
            filters: ["!^_"]
            show_if_no_docstring: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - All features: features.md
  - Guide:
      - Schema: guide/schema.md
      - Queries: guide/queries.md
      - Relational queries: guide/relational.md
      - Transactions and errors: guide/transactions.md
      - Migrations and database objects: guide/migrations.md
      - Bulk and streaming: guide/bulk.md
      - pgvector: guide/extensions.md
      - Pydantic, Supabase, Studio: guide/integrations.md
  - CLI: cli.md
  - Production: production.md
  - Known gaps: gaps.md
  - API reference:
      - mizzle: reference/mizzle.md
      - mizzle.pg: reference/pg.md
      - mizzle.pydantic: reference/pydantic.md
      - mizzle.supabase: reference/supabase.md
  - Changelog: changelog.md
